train_mode: "g_net"

# misc
device: "mps"
save_dir: "harp/models/checkpoints/csc_g"
log_interval: 1000
save_freq: 5
batch_size: 32
reviewer_costs: [2.365, 3.004]
val_freq: 1
log_dir: "harp/logs"

# model configs

## encoder
encoding_dim: 32
numeric_dim: 7
num_enc_heads: 4
num_enc_layers: 3
dgns_vocab_size: 14435
prcdr_vocab_size: 3862

## f
f_hidden_dims: [32, 16, 8, 4]
f_drouput: 0.1
f_weights_path: "harp/models/checkpoints/f/minimal_fnet_epoch_20.pt"

## g
csc_hidden_dim: 4
csc_num_layers: 3
csc_dropout: 0.1

## optimization hyperparams
bce_pos_weight: 0.2
lr: 1e-4
epochs: 20