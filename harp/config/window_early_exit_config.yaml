# Window Early Exit Training Config

# misc
device: "mps"
save_dir: "harp/models/checkpoints/window_early_exit"
log_interval: 500
save_freq: 5
batch_size: 32

# model configs

## encoder
encoding_dim: 32
numeric_dim: 7
num_enc_heads: 4
num_enc_layers: 3
dgns_vocab_size: 14435
prcdr_vocab_size: 3862

## window early exit
junior_hidden: [128, 64]
senior_hidden: [256, 256, 128, 64]

## optimization hyperparams
bce_pos_weight: 0.2
lr: 1e-4
epochs: 20

## training
train_stage: "both"

